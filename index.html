<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;600;700&family=Gasoek+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <!-- iPhone Frame / Header -->
        <div class="device-frame">
            <div class="dynamic-island"></div>

            <!-- Headline Typography Section -->
            <div class="typography-section">
                <h1 class="hero-title">Music</h1>
                <h2 class="subtitle">for a better you</h2>
                <p class="tagline">Discover. listen. feel.</p>
            </div>

            <!-- Center Hero Illustration -->
            <div class="illustration-container">
                <!-- Placeholder for the 1.png illustration -->
                <img src="1.png" alt="Lo-fi illustration: person with headphones, cat, smartphone, books, plant" class="hero-illustration">
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email or Username</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email or username" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4.5c7 0 11 8 11 8s-4 8-11 8-11-8-11-8 4-8 11-8z" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Get Started →
                </button>
            </form>

            <!-- Bottom Action & Navigation Section -->
            <div class="bottom-section">
                <p class="account-text">
                    Already have an account? <span class="signin-link">Sign in</span>
                </p>

                <div class="pagination-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
